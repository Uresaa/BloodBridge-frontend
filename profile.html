<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BloodBridge Profile</title><link rel="stylesheet" href="profile.css"></head><body><nav class="navbar"><div class="logo">Blood<span>Bridge</span></div><ul><li><a id="dashboardLink" href="#">Dashboard</a></li><li><button id="logoutButton">Logout</button></li></ul></nav><section class="profile-header"><div class="profile-card"><h1 id="profileTitle">…</h1><p id="profileRole">…</p><div class="blood-type">Blood Type: <strong id="bloodType">…</strong></div></div></section><p id="profileMessage" style="text-align:center"></p><section class="profile-content"><div class="left-column"><div class="card"><h2>Personal information</h2><form id="profileForm"><div class="input-group"><label>Full name</label><input id="fullName" required></div><div class="input-group"><label>Email</label><input id="email" type="email" disabled></div><div class="input-group"><label>Phone</label><input id="phone"></div><div class="input-group"><label>City</label><input id="city"></div><label><input id="emailNotifications" type="checkbox"> Email notifications</label><br><label><input id="smsNotifications" type="checkbox"> SMS notifications</label><br><label><input id="shareLocation" type="checkbox"> Share location automatically</label><button class="save-btn">Save profile</button></form></div></div><div class="right-column"><div id="donorSettings" class="card" hidden><h2>Donor settings</h2><form id="donorForm"><label><input id="isAvailable" type="checkbox"> Available to donate</label><p>Notification radius: <strong id="radiusLabel">15 km</strong></p><input id="notificationRadius" type="range" min="5" max="50" value="15"><button class="save-btn">Save donor settings</button></form><button id="locationButton" class="save-btn" type="button">Update my location</button></div></div></section><script src="api.js"></script><script src="profile.js"></script></body></html>
