<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BloodBridge Donor Dashboard</title>
    <link rel="stylesheet" href="../css/donor-dashboard.css" />
  </head>
  <body data-role="donor">
    <nav class="navbar">
      <div class="logo">Blood<span>Bridge</span></div>
      <ul>
        <li><a href="#requestList">Requests</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><button id="logoutButton">Logout</button></li>
      </ul>
    </nav>
    <section class="hero">
      <div class="hero-text">
        <h1>Welcome back, <span id="welcomeName">…</span></h1>
        <p>Your availability and requests below are loaded from BloodBridge.</p>
      </div>
    </section>
    <p id="pageMessage" hidden></p>
    <section class="requests">
      <h2>Open blood requests</h2>
      <div id="requestList"></div>
    </section>
    <section class="stats">
      <h2>Your donor settings</h2>
      <div class="stats-container">
        <div class="stat-card">
          <h1 id="availability">—</h1>
          <p>Availability</p>
        </div>
        <div class="stat-card">
          <h1 id="radius">—</h1>
          <p>Notification radius</p>
        </div>
        <div class="stat-card">
          <h1 id="openRequests">0</h1>
          <p>Open requests</p>
        </div>
      </div>
    </section>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
